<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story Slate</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
     <p><span>♄ <h1>Welcome to StorySlate</h1> ♄</span></p>
    </header>
    <main>
      <img
        src="images/StorySlateSeal_2_BG_No_White.png"
        alt="StorySlate Background"
        class="center_image"
      />
    </main>
    <footer>
      <p>Copyright <span id="current-year"></span> ♁ StorySlate</p>
    </footer>
    <script src="js/script.js"></script>
    <script>
        // Get the current year using JavaScript
        const currentYear = new Date().getFullYear();

        // Set the current year in the HTML element with id "current-year"
        document.getElementById("current-year").textContent = currentYear;
    </script>
  </body>
</html>
